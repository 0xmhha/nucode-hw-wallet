# ── BLE ──────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NuWallet"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4

# 본딩 필수. 페어링 없이 들어온 연결은 특성 권한에서 막힌다 (SECURITY.md §4).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y

# 니모닉(최대 49바이트)과 트랜잭션 RLP 를 몇 패킷 안에 보내려면 MTU 를 키운다.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=n

# 응답 하나가 여러 패킷으로 나갈 때 TX 버퍼가 모자라면 bt_gatt_notify 가
# -ENOMEM 을 낸다. ble.c 가 재시도하지만 버퍼 자체를 넉넉히 준다.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# BT RX 스레드에서는 조립만 한다 (지갑 코어는 메인 스레드에서 돈다 — ble.c
# 참고). 그래도 SMP 페어링 콜백이 여기서 도므로 기본 1024 보다는 올려 둔다.
CONFIG_BT_RX_STACK_SIZE=2048

# ── 저장 ─────────────────────────────────────────────────────────────────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ── 난수 ─────────────────────────────────────────────────────────────────
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CSPRNG_ENABLED=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y

# ── 주변장치 ─────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_HWINFO=y

# ── 크기·스택 ────────────────────────────────────────────────────────────
# PBKDF2-HMAC-SHA512 2048회(BIP-39)와 4096회(레코드 키)를 메인 스택에서 돌린다.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# 개인키가 스택에 남는다. 함수를 빠져나갈 때 지우고 있지만, 컴파일러가
# memset 을 지우지 못하게 최적화 수준을 낮춰 둔다.
CONFIG_SPEED_OPTIMIZATIONS=y
